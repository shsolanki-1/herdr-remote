/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm .xterm-scroll-area {
    visibility: hidden;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  user-select: text;
  white-space: pre;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}

<style>
/* One-screen terminal app: status strip, terminal, thumb key bar. Single dark look on purpose. */
:root {
  --bg: #0f1416; --panel: #172024; --line: #26343a; --fg: #d6e2e6; --muted: #7f949c;
  --accent: #5fd7ff; --ok: #9be37a; --err: #ff8a7a;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --vvh: 100dvh;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overscroll-behavior: none; }
body {
  height: var(--vvh); display: grid; grid-template-rows: auto 1fr auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  font: 13px/1.3 -apple-system, system-ui, sans-serif;
}
header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
header b { font: 600 12px var(--mono); letter-spacing: .06em; color: var(--accent); }
#status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
#status[data-kind="ok"] { color: var(--ok); }
#status[data-kind="err"] { color: var(--err); }
#k-forget { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 11px; }
#term { min-height: 0; padding: 4px 2px 0; touch-action: none; }
#term .xterm { height: 100%; }
.keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 6px; background: var(--panel); border-top: 1px solid var(--line); }
.keys button {
  font: 600 13px var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; padding: 9px 0; touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
.keys button:active { background: var(--line); }
.keys button:focus-visible { outline: 2px solid var(--accent); }
#k-prefix { color: var(--accent); border-color: var(--accent); }
#k-ctrl[aria-pressed="true"], #k-shift[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<header><b>HERDR</b><span id="status">Starting…</span><button id="k-forget" type="button">Forget</button></header>
<div id="term"></div>
<nav class="keys" aria-label="Terminal keys">
  <button id="k-prefix" type="button" title="Herdr prefix (Ctrl+A)">^A</button>
  <button id="k-esc" type="button">Esc</button>
  <button id="k-tab" type="button">Tab</button>
  <button id="k-ctrl" type="button" aria-pressed="false" title="Ctrl for next key">Ctrl</button>
  <button id="k-up" type="button" aria-label="Up">↑</button>
  <button id="k-kbd" type="button" aria-label="Show or hide keyboard">⌨</button>
  <button id="k-pgup" type="button">PgUp</button>
  <button id="k-pgdn" type="button">PgDn</button>
  <button id="k-left" type="button" aria-label="Left">←</button>
  <button id="k-down" type="button" aria-label="Down">↓</button>
  <button id="k-right" type="button" aria-label="Right">→</button>
  <button id="k-shift" type="button" aria-pressed="false" title="Shift for next key or arrow">Shift</button>
</nav>
